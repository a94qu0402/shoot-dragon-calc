<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>射龍門 籌碼/彩金計算器（手動版）</title>
  <style>
    body
    {
      font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 16px;
      line-height: 1.4;
    }
    .row
    {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 12px;
    }
    .card
    {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label
    {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }
    input, select, button, textarea
    {
      font-size: 14px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }
    button
    {
      cursor: pointer;
    }
    table
    {
      width: 100%;
      border-collapse: collapse;
    }
    th, td
    {
      border-bottom: 1px solid #eee;
      padding: 8px;
      text-align: left;
    }
    th
    {
      background: #fafafa;
    }
    .mono
    {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .muted
    {
      color: #666;
      font-size: 13px;
    }
    .danger
    {
      color: #b00020;
    }
  </style>
</head>

<body>
  <h2>射龍門 籌碼/彩金計算器（手動版）</h2>

  <div class="muted">
    規則：
    <br>1) 開局每人付最低投注進彩金（入場費不退）
    <br>2) 補牌下注 X：
    <br>　射中：+X（從彩金拿）
    <br>　沒中：-X（加進彩金）
    <br>　撞柱：-2X（加進彩金）
    <br>　對子三張同點：-3X（加進彩金）
  </div>

  <div class="card">
    <h3>① 設定玩家</h3>
    <div class="row">
      <div>
        <label>最低投注（入場費）</label>
        <input id="idMinBet" type="number" value="10" />
      </div>
      <div style="min-width: 300px;">
        <label>玩家名單（逗號分隔）</label>
        <input id="idPlayers" type="text" value="A,B,C,D,E" style="width:100%;" />
      </div>
      <div>
        <label>初始籌碼</label>
        <input id="idStartChip" type="number" value="0" />
      </div>
      <div>
        <button id="idBtnInit">建立名單</button>
      </div>
    </div>

    <div class="row">
      <button id="idBtnStartRound">開始新一局（扣入場費→彩金）</button>
      <button id="idBtnResetAll" class="danger">全部清空</button>
    </div>
  </div>

  <div class="card">
    <h3>② 手動結算下注結果</h3>

    <div class="row">
      <div>
        <label>玩家</label>
        <select id="idSelPlayer"></select>
      </div>

      <div>
        <label>投注金額 X</label>
        <input id="idBet" type="number" value="30" />
      </div>

      <div>
        <label>結果</label>
        <select id="idOutcome">
          <option value="win">射中（+X）</option>
          <option value="lose">沒中（-X）</option>
          <option value="hit2">撞柱（-2X）</option>
          <option value="hit3">三張同點（-3X）</option>
          <option value="skip">不補（0）</option>
        </select>
      </div>

      <div>
        <button id="idBtnApply">套用</button>
        <button id="idBtnUndo">復原</button>
      </div>
    </div>

    <div class="mono">
      目前彩金：<span id="idPot">0</span>
    </div>
  </div>

  <div class="card">
    <h3>③ 玩家籌碼表</h3>
    <table>
      <thead>
        <tr>
          <th>玩家</th>
          <th>籌碼</th>
        </tr>
      </thead>
      <tbody id="idTBodyPlayers"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>④ 歷史紀錄</h3>
    <textarea id="idHistory" rows="8" style="width:100%;" readonly></textarea>
  </div>

  <script>
    let g_iPot = 0;
    let g_arrPlayers = [];
    let g_arrUndoStack = [];

    const pMinBet = document.getElementById("idMinBet");
    const pPlayers = document.getElementById("idPlayers");
    const pStartChip = document.getElementById("idStartChip");

    const pSelPlayer = document.getElementById("idSelPlayer");
    const pBet = document.getElementById("idBet");
    const pOutcome = document.getElementById("idOutcome");

    const pPot = document.getElementById("idPot");
    const pTBodyPlayers = document.getElementById("idTBodyPlayers");
    const pHistory = document.getElementById("idHistory");

    function fnSnapshot()
    {
      g_arrUndoStack.push(
      {
        iPot: g_iPot,
        arrPlayers: JSON.parse(JSON.stringify(g_arrPlayers)),
        strHistory: pHistory.value
      });
    }

    function fnUndo()
    {
      if (g_arrUndoStack.length <= 0)
      {
        return;
      }

      const oSnap = g_arrUndoStack.pop();
      g_iPot = oSnap.iPot;
      g_arrPlayers = oSnap.arrPlayers;
      pHistory.value = oSnap.strHistory;

      fnRenderAll();
    }

    function fnAppendHistory(strLine)
    {
      pHistory.value += strLine + "\n";
    }

    function fnRenderAll()
    {
      pPot.textContent = g_iPot;

      pSelPlayer.innerHTML = "";
      pTBodyPlayers.innerHTML = "";

      for (let i = 0; i < g_arrPlayers.length; i++)
      {
        const oP = g_arrPlayers[i];

        const pOpt = document.createElement("option");
        pOpt.value = i;
        pOpt.textContent = oP.strName;
        pSelPlayer.appendChild(pOpt);

        const pTr = document.createElement("tr");
        pTr.innerHTML =
          "<td>" + oP.strName + "</td>" +
          "<td class='mono'>" + oP.iChip + "</td>";
        pTBodyPlayers.appendChild(pTr);
      }
    }

    function fnInitPlayers()
    {
      const iStart = Number(pStartChip.value);
      const arrNames = pPlayers.value.split(",");

      g_arrPlayers = [];
      for (let i = 0; i < arrNames.length; i++)
      {
        const strName = arrNames[i].trim();
        if (strName.length > 0)
        {
          g_arrPlayers.push({ strName: strName, iChip: iStart });
        }
      }

      g_iPot = 0;
      pHistory.value = "";
      g_arrUndoStack = [];

      fnAppendHistory("[系統] 名單建立完成");
      fnRenderAll();
    }

    function fnStartRound()
    {
      fnSnapshot();

      const iMin = Number(pMinBet.value);
      for (let i = 0; i < g_arrPlayers.length; i++)
      {
        g_arrPlayers[i].iChip -= iMin;
        g_iPot += iMin;
      }

      fnAppendHistory("[開局] 每人入場費 " + iMin + "，彩金=" + g_iPot);
      fnRenderAll();
    }

    function fnApply()
    {
      fnSnapshot();

      const iIdx = Number(pSelPlayer.value);
      const iX = Number(pBet.value);
      const strOutcome = pOutcome.value;

      let iDeltaChip = 0;
      let iDeltaPot = 0;

      if (strOutcome === "win")
      {
        iDeltaChip = iX;
        iDeltaPot = -iX;
      }
      else if (strOutcome === "lose")
      {
        iDeltaChip = -iX;
        iDeltaPot = iX;
      }
      else if (strOutcome === "hit2")
      {
        iDeltaChip = -2 * iX;
        iDeltaPot = 2 * iX;
      }
      else if (strOutcome === "hit3")
      {
        iDeltaChip = -3 * iX;
        iDeltaPot = 3 * iX;
      }

      g_arrPlayers[iIdx].iChip += iDeltaChip;
      g_iPot += iDeltaPot;

      fnAppendHistory(
        "[結算] " + g_arrPlayers[iIdx].strName +
        " 結果=" + strOutcome +
        " 籌碼變動=" + iDeltaChip +
        " 彩金=" + g_iPot
      );

      fnRenderAll();
    }

    document.getElementById("idBtnInit").addEventListener("click", fnInitPlayers);
    document.getElementById("idBtnStartRound").addEventListener("click", fnStartRound);
    document.getElementById("idBtnApply").addEventListener("click", fnApply);
    document.getElementById("idBtnUndo").addEventListener("click", fnUndo);

    document.getElementById("idBtnResetAll").addEventListener("click", function()
    {
      g_iPot = 0;
      g_arrPlayers = [];
      pHistory.value = "";
      fnRenderAll();
    });

    fnInitPlayers();
  </script>
</body>
</html>
