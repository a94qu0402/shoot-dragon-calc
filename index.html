<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>射龍門 籌碼/彩金計算器</title>
  <style>
    body
    {
      font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 16px;
      line-height: 1.4;
    }
    .row
    {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 12px;
    }
    .card
    {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label
    {
      display: block;
      font-size: 13px;
      color: #333;
      margin-bottom: 4px;
    }
    input, select, button, textarea
    {
      font-size: 14px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }
    input:focus, select:focus, textarea:focus
    {
      border-color: #666;
    }
    button
    {
      cursor: pointer;
    }
    table
    {
      width: 100%;
      border-collapse: collapse;
    }
    th, td
    {
      border-bottom: 1px solid #eee;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th
    {
      background: #fafafa;
      position: sticky;
      top: 0;
    }
    .mono
    {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .muted
    {
      color: #666;
      font-size: 13px;
    }
    .danger
    {
      color: #b00020;
    }
    .ok
    {
      color: #0a7a0a;
    }
  </style>
</head>
<body>
  <h2>射龍門 籌碼/彩金計算器（離線單頁版）</h2>
  <div class="muted">
    規則採用你描述的版本：開局每人付 1 倍最低投注進彩金；補牌下注 X：射中 +X（從彩金拿）、沒中 -X（加進彩金）、撞柱 -2X（加進彩金）、不補不退入場費。
  </div>

  <div class="card">
    <h3>① 設定玩家與最低投注</h3>
    <div class="row">
      <div>
        <label>最低投注（入場費）</label>
        <input id="idMinBet" type="number" min="0" step="1" value="10" />
      </div>
      <div style="min-width: 360px;">
        <label>玩家名單（用逗號分隔，例如：A,B,C）</label>
        <input id="idPlayers" type="text" value="A,B,C,D,E" style="width: 100%;" />
      </div>
      <div>
        <label>每位玩家初始籌碼（可為 0）</label>
        <input id="idStartChip" type="number" step="1" value="0" />
      </div>
      <div>
        <button id="idBtnInit">建立/重置名單</button>
      </div>
    </div>
    <div class="row">
      <div>
        <button id="idBtnStartRound">開始新一局（每人扣入場費→加到彩金）</button>
      </div>
      <div>
        <button id="idBtnResetAll" class="danger">全部清空（含歷史）</button>
      </div>
    </div>
    <div class="muted">
      小提醒：如果你們「每局」都要再付一次入場費，就每局按一次「開始新一局」；如果只在整場開始時付一次，就只按一次。
    </div>
  </div>

  <div class="card">
    <h3>② 進行補牌/結算</h3>
    <div class="row">
      <div>
        <label>選擇玩家</label>
        <select id="idSelPlayer"></select>
      </div>
      <div>
        <label>本次投注金額 X（不得超過目前彩金）</label>
        <input id="idBet" type="number" min="0" step="1" value="30" />
      </div>
      <div>
        <label>結果</label>
        <select id="idOutcome">
          <option value="win">射中龍門（+X）</option>
          <option value="lose">沒射中（-X）</option>
          <option value="hit">撞柱（-2X）</option>
          <option value="skip">不補（0，入場費不退）</option>
        </select>
      </div>
      <div>
        <label>備註（可不填）</label>
        <input id="idNote" type="text" placeholder="例如：門牌 3-9 / 下注原因..." style="width: 260px;" />
      </div>
      <div>
        <button id="idBtnApply">套用這次結果</button>
      </div>
      <div>
        <button id="idBtnUndo">復原上一步</button>
      </div>
    </div>
    <div class="row">
      <div class="card" style="flex: 1; min-width: 260px; margin: 0;">
        <div><b>目前彩金：</b><span id="idPot" class="mono">0</span></div>
        <div class="muted">射中會從彩金扣 X；沒中/撞柱會把 X/2X 加進彩金。</div>
      </div>
      <div class="card" style="flex: 2; min-width: 260px; margin: 0;">
        <div class="muted">快速檢查</div>
        <div id="idQuickCheck" class="mono"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>③ 玩家籌碼表</h3>
    <table>
      <thead>
        <tr>
          <th>玩家</th>
          <th>籌碼</th>
          <th>統計（勝/負/撞/不補）</th>
        </tr>
      </thead>
      <tbody id="idTBodyPlayers"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>④ 歷史紀錄</h3>
    <div class="muted">每次套用結果都會記錄，方便對帳；可用「復原上一步」回退。</div>
    <textarea id="idHistory" rows="10" style="width: 100%;" class="mono" readonly></textarea>
  </div>

  <script>
    // ====== 狀態 ======
    let g_iPot = 0;
    let g_arrPlayers = []; // { strName, iChip, iWin, iLose, iHit, iSkip }
    let g_arrUndoStack = []; // snapshot stack

    // ====== DOM 指標 ======
    const pMinBet = document.getElementById("idMinBet");
    const pPlayers = document.getElementById("idPlayers");
    const pStartChip = document.getElementById("idStartChip");
    const pBtnInit = document.getElementById("idBtnInit");
    const pBtnStartRound = document.getElementById("idBtnStartRound");
    const pBtnResetAll = document.getElementById("idBtnResetAll");

    const pSelPlayer = document.getElementById("idSelPlayer");
    const pBet = document.getElementById("idBet");
    const pOutcome = document.getElementById("idOutcome");
    const pNote = document.getElementById("idNote");
    const pBtnApply = document.getElementById("idBtnApply");
    const pBtnUndo = document.getElementById("idBtnUndo");

    const pPot = document.getElementById("idPot");
    const pTBodyPlayers = document.getElementById("idTBodyPlayers");
    const pHistory = document.getElementById("idHistory");
    const pQuickCheck = document.getElementById("idQuickCheck");

    // ====== 工具函式 ======
    function fnClampToInt(iVal)
    {
      if (Number.isFinite(iVal) === false)
      {
        return 0;
      }
      return Math.trunc(iVal);
    }

    function fnSnapshot()
    {
      const oSnap =
      {
        iPot: g_iPot,
        arrPlayers: JSON.parse(JSON.stringify(g_arrPlayers)),
        strHistory: pHistory.value
      };
      g_arrUndoStack.push(oSnap);
      if (g_arrUndoStack.length > 50)
      {
        g_arrUndoStack.shift();
      }
    }

    function fnUndo()
    {
      if (g_arrUndoStack.length <= 0)
      {
        return;
      }
      const oSnap = g_arrUndoStack.pop();
      g_iPot = oSnap.iPot;
      g_arrPlayers = oSnap.arrPlayers;
      pHistory.value = oSnap.strHistory;
      fnRenderAll();
    }

    function fnAppendHistory(strLine)
    {
      const strOld = pHistory.value.trimEnd();
      if (strOld.length <= 0)
      {
        pHistory.value = strLine;
      }
      else
      {
        pHistory.value = strOld + "\n" + strLine;
      }
      pHistory.scrollTop = pHistory.scrollHeight;
    }

    function fnRenderPlayersSelect()
    {
      pSelPlayer.innerHTML = "";
      for (let i = 0; i < g_arrPlayers.length; i++)
      {
        const oP = g_arrPlayers[i];
        const pOpt = document.createElement("option");
        pOpt.value = String(i);
        pOpt.textContent = oP.strName;
        pSelPlayer.appendChild(pOpt);
      }
    }

    function fnRenderPlayersTable()
    {
      pTBodyPlayers.innerHTML = "";
      for (let i = 0; i < g_arrPlayers.length; i++)
      {
        const oP = g_arrPlayers[i];

        const pTr = document.createElement("tr");

        const pTdName = document.createElement("td");
        pTdName.textContent = oP.strName;

        const pTdChip = document.createElement("td");
        pTdChip.className = "mono";
        pTdChip.textContent = String(oP.iChip);

        const pTdStat = document.createElement("td");
        pTdStat.className = "mono";
        pTdStat.textContent =
          "勝 " + oP.iWin + " / 負 " + oP.iLose + " / 撞 " + oP.iHit + " / 不補 " + oP.iSkip;

        pTr.appendChild(pTdName);
        pTr.appendChild(pTdChip);
        pTr.appendChild(pTdStat);

        pTBodyPlayers.appendChild(pTr);
      }
    }

    function fnRenderPot()
    {
      pPot.textContent = String(g_iPot);
    }

    function fnRenderQuickCheck()
    {
      const iIdx = fnClampToInt(Number(pSelPlayer.value));
      const iX = fnClampToInt(Number(pBet.value));
      const strOutcome = String(pOutcome.value);

      if (g_arrPlayers.length <= 0 || iIdx < 0 || iIdx >= g_arrPlayers.length)
      {
        pQuickCheck.textContent = "";
        return;
      }

      const oP = g_arrPlayers[iIdx];

      let iDeltaChip = 0;
      let iDeltaPot = 0;

      if (strOutcome === "win")
      {
        iDeltaChip = iX;
        iDeltaPot = -iX;
      }
      else if (strOutcome === "lose")
      {
        iDeltaChip = -iX;
        iDeltaPot = iX;
      }
      else if (strOutcome === "hit")
      {
        iDeltaChip = -2 * iX;
        iDeltaPot = 2 * iX;
      }
      else
      {
        iDeltaChip = 0;
        iDeltaPot = 0;
      }

      const iPotAfter = g_iPot + iDeltaPot;
      const iChipAfter = oP.iChip + iDeltaChip;

      const strWarn =
        (strOutcome !== "skip" && iX > g_iPot && strOutcome === "win")
        ? "  （警告：射中需要從彩金扣 X，但彩金不足）"
        : "";

      pQuickCheck.textContent =
        "玩家 " + oP.strName +
        "：籌碼 " + oP.iChip + " → " + iChipAfter +
        "；彩金 " + g_iPot + " → " + iPotAfter +
        strWarn;
    }

    function fnRenderAll()
    {
      fnRenderPlayersSelect();
      fnRenderPlayersTable();
      fnRenderPot();
      fnRenderQuickCheck();
    }

    // ====== 核心操作 ======
    function fnInitPlayers()
    {
      const iStartChip = fnClampToInt(Number(pStartChip.value));
      const strRaw = String(pPlayers.value || "");
      const arrRaw = strRaw.split(",");

      g_arrPlayers = [];
      for (let i = 0; i < arrRaw.length; i++)
      {
        const strName = arrRaw[i].trim();
        if (strName.length <= 0)
        {
          continue;
        }
        g_arrPlayers.push(
        {
          strName: strName,
          iChip: iStartChip,
          iWin: 0,
          iLose: 0,
          iHit: 0,
          iSkip: 0
        });
      }

      g_iPot = 0;
      g_arrUndoStack = [];
      pHistory.value = "";

      fnRenderAll();
      fnAppendHistory("[系統] 已建立名單，共 " + g_arrPlayers.length + " 人；彩金歸零。");
    }

    function fnStartNewRound()
    {
      const iMin = fnClampToInt(Number(pMinBet.value));
      if (g_arrPlayers.length <= 0)
      {
        fnAppendHistory("[系統] 需要先建立名單。");
        return;
      }

      fnSnapshot();

      let iSum = 0;
      for (let i = 0; i < g_arrPlayers.length; i++)
      {
        g_arrPlayers[i].iChip -= iMin;
        iSum += iMin;
      }
      g_iPot += iSum;

      fnRenderAll();
      fnAppendHistory("[開局] 每人入場費 " + iMin + "，共加入彩金 " + iSum + "；目前彩金 " + g_iPot + "。");
    }

    function fnApply()
    {
      if (g_arrPlayers.length <= 0)
      {
        fnAppendHistory("[系統] 需要先建立名單。");
        return;
      }

      const iIdx = fnClampToInt(Number(pSelPlayer.value));
      if (iIdx < 0 || iIdx >= g_arrPlayers.length)
      {
        fnAppendHistory("[系統] 玩家索引無效。");
        return;
      }

      const oP = g_arrPlayers[iIdx];
      const iX = fnClampToInt(Number(pBet.value));
      const strOutcome = String(pOutcome.value);
      const strNote = String(pNote.value || "").trim();

      if (strOutcome !== "skip")
      {
        if (iX <= 0)
        {
          fnAppendHistory("[系統] 投注金額 X 需大於 0。");
          return;
        }
        if (iX > g_iPot && strOutcome === "win")
        {
          fnAppendHistory("[系統] 射中需要從彩金扣 X，但目前彩金不足（彩金 " + g_iPot + "，X " + iX + "）。");
          return;
        }
        if (iX > g_iPot && strOutcome !== "win")
        {
          // 你貼的規則限制「投注不得超過彩金總額」
          fnAppendHistory("[系統] 投注金額不得超過彩金總額（彩金 " + g_iPot + "，X " + iX + "）。");
          return;
        }
      }

      fnSnapshot();

      let iDeltaChip = 0;
      let iDeltaPot = 0;
      let strTag = "";

      if (strOutcome === "win")
      {
        iDeltaChip = iX;
        iDeltaPot = -iX;
        oP.iWin += 1;
        strTag = "射中";
      }
      else if (strOutcome === "lose")
      {
        iDeltaChip = -iX;
        iDeltaPot = iX;
        oP.iLose += 1;
        strTag = "沒中";
      }
      else if (strOutcome === "hit")
      {
        iDeltaChip = -2 * iX;
        iDeltaPot = 2 * iX;
        oP.iHit += 1;
        strTag = "撞柱";
      }
      else
      {
        iDeltaChip = 0;
        iDeltaPot = 0;
        oP.iSkip += 1;
        strTag = "不補";
      }

      oP.iChip += iDeltaChip;
      g_iPot += iDeltaPot;

      fnRenderAll();

      const strLine =
        "[結算] " + oP.strName +
        "｜" + strTag +
        (strOutcome === "skip" ? "" : ("｜X=" + iX)) +
        "｜籌碼變動 " + iDeltaChip +
        "｜彩金變動 " + iDeltaPot +
        "｜目前彩金 " + g_iPot +
        (strNote.length > 0 ? ("｜註：" + strNote) : "");

      fnAppendHistory(strLine);

      pNote.value = "";
    }

    function fnResetAll()
    {
      g_iPot = 0;
      g_arrPlayers = [];
      g_arrUndoStack = [];
      pHistory.value = "";
      fnRenderAll();
    }

    // ====== 綁定事件 ======
    pBtnInit.addEventListener("click", function()
    {
      fnInitPlayers();
    });

    pBtnStartRound.addEventListener("click", function()
    {
      fnStartNewRound();
    });

    pBtnApply.addEventListener("click", function()
    {
      fnApply();
    });

    pBtnUndo.addEventListener("click", function()
    {
      fnUndo();
    });

    pBtnResetAll.addEventListener("click", function()
    {
      fnResetAll();
    });

    pSelPlayer.addEventListener("change", function()
    {
      fnRenderQuickCheck();
    });

    pBet.addEventListener("input", function()
    {
      fnRenderQuickCheck();
    });

    pOutcome.addEventListener("change", function()
    {
      fnRenderQuickCheck();
    });

    // ====== 初始 ======
    fnInitPlayers();
  </script>
</body>
</html>
